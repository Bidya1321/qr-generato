<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Utilities // QR & Timer</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151f32;
            --bg-input: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            max-width: 1000px;
            margin: 0 auto 3rem auto;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent-blue);
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid #243552;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid #243552;
            padding-bottom: 0.75rem;
        }

        /* Shared UI Elements */
        input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 1rem;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        button {
            width: 100%;
            padding: 0.75rem 1.2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        /* QR Generator Specifics */
        .qr-btn {
            background-color: var(--accent-blue);
            color: #000;
        }

        .qr-display-box {
            margin-top: 1.5rem;
            background-color: #fff;
            padding: 1rem;
            border-radius: 12px;
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .qr-display-box img {
            max-width: 100%;
            height: auto;
        }

        /* Timer Specifics */
        .timer-display {
            font-size: 4rem;
            font-weight: 700;
            text-align: center;
            font-family: monospace;
            margin: 1.5rem 0;
            letter-spacing: 0.05em;
            color: var(--text-main);
        }

        .timer-controls {
            display: flex;
            gap: 1rem;
        }

        .btn-start { background-color: var(--accent-green); color: #000; }
        .btn-pause { background-color: var(--accent-blue); color: #000; }
        .btn-reset { background-color: var(--accent-red); color: #000; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Developer Workspace</h1>
        <p>Two essential utility tools packed into a single dashboard viewport.</p>
    </header>

    <div class="container">
        
        <!-- TOOL 1: QR Code Generator -->
        <div class="card">
            <h2 class="card-title">🌐 QR Code Generator</h2>
            <p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem;">
                Enter text or a URL link below to instantly generate a scannable graphic block.
            </p>
            <input type="text" id="qrInput" placeholder="https://example.com or secret text..." autocomplete="off">
            <button class="qr-btn" onclick="generateQR()">Generate QR Code</button>
            
            <div class="qr-display-box" id="qrBox">
                <!-- QR Image loaded dynamically -->
            </div>
        </div>

        <!-- TOOL 2: Countdown Timer -->
        <div class="card">
            <h2 class="card-title">⏱️ Deep Work Timer</h2>
            <p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem;">
                Set a duration threshold in minutes to handle your programming sessions.
            </p>
            <input type="number" id="timerInput" placeholder="Minutes (e.g., 25)" min="1" max="180">
            
            <div class="timer-display" id="timeDisplay">00:00</div>
            
            <div class="timer-controls">
                <button class="btn-start" id="startBtn" onclick="startTimer()">Start</button>
                <button class="btn-reset" onclick="resetTimer()">Reset</button>
            </div>
        </div>

    </div>

    <script>
        // --- QR CODE GENERATOR LOGIC ---
        function generateQR() {
            const inputData = document.getElementById('qrInput').value.trim();
            const qrBox = document.getElementById('qrBox');

            if (!inputData) {
                alert('Please type or paste some text/URL first!');
                return;
            }

            // Using the secure API endpoint to render the string directly inside an image source link
            const safeQuery = encodeURIComponent(inputData);
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${safeQuery}`;
            
            qrBox.innerHTML = `<img src="${qrUrl}" alt="Generated QR code content">`;
            qrBox.style.display = 'flex';
        }

        // --- TIMER LOGIC ---
        let countdown;
        let totalSecondsRemaining = 0;
        let isRunning = false;

        const timeDisplay = document.getElementById('timeDisplay');
        const startBtn = document.getElementById('startBtn');
        const timerInput = document.getElementById('timerInput');

        function updateDisplay(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timeDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (isRunning) {
                // Pause action
                clearInterval(countdown);
                isRunning = false;
                startBtn.textContent = 'Resume';
                startBtn.className = 'btn-pause';
                return;
            }

            // If completely fresh start, capture the input fields value
            if (totalSecondsRemaining === 0) {
                const minutesInput = parseInt(timerInput.value);
                if (isNaN(minutesInput) || minutesInput <= 0) {
                    alert('Please enter a valid number of minutes greater than 0.');
                    return;
                }
                totalSecondsRemaining = minutesInput * 60;
            }

            isRunning = true;
            startBtn.textContent = 'Pause';
            startBtn.className = 'btn-pause';

            countdown = setInterval(() => {
                totalSecondsRemaining--;
                updateDisplay(totalSecondsRemaining);

                if (totalSecondsRemaining <= 0) {
                    clearInterval(countdown);
                    isRunning = false;
                    startBtn.textContent = 'Start';
                    startBtn.className = 'btn-start';
                    alert('Session complete! Take a step back and stretch.');
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(countdown);
            isRunning = false;
            totalSecondsRemaining = 0;
            updateDisplay(0);
            startBtn.textContent = 'Start';
            startBtn.className = 'btn-start';
            timerInput.value = '';
        }
    </script>
</body>
</html>
